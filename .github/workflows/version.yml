name: Tag Action

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # sin ref: main — deja que el evento determine el commit exacto

      - name: Obtener versión actual
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "current_version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generar changelog automático
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          if [ -z "$CHANGELOG" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Verificar si hay cambios
        if: steps.changelog.outputs.no_changes == 'true'
        run: |
          echo "⚠️ No hay nuevos commits desde el último release. No se creará tag."
          exit 0

      - name: Crear tag
        if: steps.changelog.outputs.no_changes == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️ El tag $TAG ya existe. No se creará duplicado."
            exit 0
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Crear Release con changelog automático
        if: steps.changelog.outputs.no_changes == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Release v${{ steps.version.outputs.version }}

            ### 📝 Cambios desde último release:

            ${{ steps.changelog.outputs.changelog }}

            ---
            *Este release fue generado automáticamente por GitHub Actions*
          draft: false
          prerelease: false
          # generate_release_notes eliminado para evitar deployments automáticos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar éxito
        if: steps.changelog.outputs.no_changes == 'false'
        run: |
          echo "✅ Release creado exitosamente: v${{ steps.version.outputs.version }}"